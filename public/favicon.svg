<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bluebellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bellGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded blue badge for visibility across light & dark browser tabs -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bluebellBg)" />
  <rect x="3" y="3" width="42" height="42" rx="11" fill="none" stroke="#93c5fd" stroke-width="1" stroke-opacity="0.4" />

  <!-- Anne TH Jackson Psychotherapy Bluebell Motif (matching website header) -->
  <g transform="translate(7.2, 7.2) scale(1.4)">
    <!-- Arching stem -->
    <path
      d="M4 21C4 13.5 7 5 16 5c2.5 0 4 1 5 2.5"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Slender bluebell stem & pedicels -->
    <path
      d="M4 21c2.5-4.5 3.5-9.5 3.5-14"
      fill="none"
      stroke="#bfdbfe"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M18.5 6.5v2M12.5 7.5v2"
      fill="none"
      stroke="#bfdbfe"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Upper Bell floret with gentle glow -->
    <path
      d="M18.5 8.5c2 1 3.2 3 3.5 5c-1.2-.8-2.3-.8-3.5 0c-1.2-.8-2.3-.8-3.5 0c.3-2 1.5-4 3.5-5Z"
      fill="url(#bellGlow)"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Lower Bell floret with gentle glow -->
    <path
      d="M12.5 9.5c1.7.9 2.7 2.6 3 4.5c-1-.7-2-.7-3 0c-1-.7-2-.7-3 0c.3-1.9 1.3-3.6 3-4.5Z"
      fill="url(#bellGlow)"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>