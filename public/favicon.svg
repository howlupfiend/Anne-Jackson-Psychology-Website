<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded badge for visibility across light & dark browser tabs -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#emeraldBg)" />
  <rect x="3" y="3" width="42" height="42" rx="11" fill="none" stroke="#6ee7b7" stroke-width="1" stroke-opacity="0.35" />

  <!-- Anne TH Jackson Psychotherapy Leaf Motif (matching website header) -->
  <g transform="translate(7.2, 7.2) scale(1.4)">
    <!-- Leaf body with soft translucent inner fill -->
    <path
      d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"
      fill="url(#leafGlow)"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center growth vein -->
    <path
      d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"
      fill="none"
      stroke="#a7f3d0"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>